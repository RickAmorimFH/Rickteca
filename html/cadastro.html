<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RICKOTECA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <!-- Atualizando logo e nome do site -->
            <img src="../imagem/icon/logo.png" alt="RICKOTECA Logo" class="logo-img">
            <h1 class="site-name">RICKOTECA</h1>
        </div>
        <nav class="header-right">
            <a href="../index.html" class="nav-link">Home</a>
            <a href="../index.html" class="nav-link">Sobre</a>
            <a href="../index.html" class="nav-link">Contato</a>
            <a href="cadastro.html" class="nav-link active">Cadastro</a>

            <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema" title="Alternar tema">🌞</button>

        </nav>
    </header>

    <!-- Formulário de Cadastro -->
    <main class="cadastro-container">
        <div class="cadastro-card">
            <h2 class="cadastro-title">Cadastre-se</h2>
            <p class="cadastro-subtitle">Junte-se à nossa comunidade de leitores</p>
            
            <form id="cadastroForm" class="cadastro-form">
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição (Opcional)</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Conte-nos um pouco sobre você e seus interesses literários..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Cadastrar</button>
            </form>

            <!-- Mensagem de Sucesso -->
            <div id="successMessage" class="success-message">
                ✓ Cadastro realizado com sucesso! Redirecionando...
            </div>
        </div>
    </main>

    <script src="../js/cadastro.js"></script>
    <!-- Adicionando script de acessibilidade -->
    <script src="../js/accessibility.js"></script>
</body>
</html>
